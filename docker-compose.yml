x-db-env: &db-env
  DB_HOST: banco
  DB_PORT: 5432
  DB_USERNAME: ${DB_USERNAME:-pdv}
  DB_PASSWORD: ${DB_PASSWORD:-pdv}
  DB_DATABASE: ${DB_DATABASE:-pdv_db}

services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-pdv}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pdv}
      POSTGRES_DB: ${DB_DATABASE:-pdv_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: pdv-api
    environment: *db-env
    ports:
      - "3000:3000"
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/produtos').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  seed:
    build: .
    image: pdv-api
    profiles: ["tools"]
    command: ["npm", "run", "seed"]
    environment: *db-env
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: